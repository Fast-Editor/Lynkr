name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Guard: the lockfile must only reference the public npm registry.
      # A private/corporate mirror URL in `resolved` breaks `npm install` /
      # `npm ci` / Docker builds for everyone outside that network (this
      # shipped once — 100 npm.devsnc.com URLs made from-source installs 403
      # for the public). Recurs silently whenever someone on a corporate
      # network runs `npm install` and commits the lockfile.
      - name: Lockfile uses public registry only
        run: |
          if grep -oE '"resolved": "https://[^/"]*' package-lock.json | grep -v 'registry.npmjs.org'; then
            echo "::error::package-lock.json contains non-public registry URLs (see above). Regenerate off the corporate network: rm -rf node_modules package-lock.json && npm install"
            exit 1
          fi
        timeout-minutes: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --no-optional --ignore-scripts --no-frozen-lockfile
        timeout-minutes: 5

      - name: Lint (blocking)
        run: npx eslint src index.js --max-warnings 0
        timeout-minutes: 3

      # npm audit needs the registry's advisory endpoint, which flaps during
      # npm incidents: the POST hangs with no response (observed 2026-09-03,
      # status page already claiming "operational") and the old bare step
      # timed out, failing unrelated PRs. Policy: real vulnerability findings
      # FAIL immediately; a hung/unreachable advisory service retries 3x and
      # then warns-and-passes — npm's availability must not block merges, and
      # the audit re-runs on every subsequent push anyway.
      - name: Audit (no high/critical)
        run: |
          for attempt in 1 2 3; do
            set +e
            out=$(timeout 75 npm audit --audit-level=high 2>&1); code=$?
            set -e
            echo "$out" | tail -15
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 124 ]; then
              echo "::warning::npm audit attempt $attempt timed out — registry advisory endpoint unresponsive"
              continue
            fi
            # Non-zero, non-timeout: real vulnerabilities (or a real npm
            # error) — fail loudly.
            exit "$code"
          done
          echo "::warning::npm audit SKIPPED after 3 timeouts (npm registry incident). This is not a clean audit pass — re-run this job once npm recovers."
          exit 0
        timeout-minutes: 5

      - name: Test
        run: |
          DATABRICKS_API_KEY=test-key DATABRICKS_API_BASE=http://test.com \
          node --test \
            test/routing.test.js \
            test/hybrid-routing-integration.test.js \
            test/passthrough-mode.test.js \
            test/openrouter-error-resilience.test.js \
            test/format-conversion.test.js \
            test/azure-openai-config.test.js \
            test/azure-openai-format-conversion.test.js \
            test/azure-openai-routing.test.js \
            test/azure-openai-streaming.test.js \
            test/azure-openai-error-resilience.test.js \
            test/azure-openai-integration.test.js \
            test/openai-integration.test.js \
            test/toon-compression.test.js \
            test/llamacpp-integration.test.js \
            test/resilience.test.js \
            test/telemetry-routing.test.js \
            test/distill.test.js \
            test/large-payload.test.js \
            test/prompt-cache-injection.test.js
        timeout-minutes: 5
