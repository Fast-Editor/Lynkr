name: Publish to npm

# Publishes when a version tag is pushed:
#   npm version patch --no-git-tag-version && git commit -am "release: vX.Y.Z"
#   git tag vX.Y.Z && git push origin main --tags
#
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# One-time setup on npmjs.com: package "lynkr" → Settings → Trusted Publisher
#   → GitHub Actions → repo: Fast-Editor/Lynkr, workflow: npm-publish.yml
# Until that's configured, uncomment the NODE_AUTH_TOKEN lines and add an
# automation token as the NPM_TOKEN repo secret instead.

on:
  push:
    tags:
      - "v*"
  # Also callable from auto-tag.yml, which publishes without a tag event
  # (bot-pushed tags don't fire workflows). The version-match gate below
  # only applies to tag pushes.
  workflow_call:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        # Tag pushes only — reusable calls from auto-tag.yml run on the
        # branch ref, where there is no tag to compare against.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # pnpm, mirroring ci.yml: `npm ci` compiles native addons from source
      # on runners and blows past any sane timeout (v9.14.1: 27 min;
      # v9.14.2: 5-min timeout hit). The test gate doesn't need natives and
      # `npm publish` only packs files.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-optional --ignore-scripts --no-frozen-lockfile
        timeout-minutes: 5

      # Gate on the routing regression suite. Widen to `npm run test:unit`
      # once the full suite is green in CI.
      - name: Test
        run: npm run test:quick

      - name: Publish
        run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
