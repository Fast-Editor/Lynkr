# OpenCodeReview - GitHub Actions PR Auto-Review (free tier + Lynkr-tier-aligned)
#
# Triggers a code review every time a PR is opened/updated on this repo,
# plus on-demand re-review via `/open-code-review` comments.
# Hosted 100% on GitHub Actions free minutes (public repo = free).
#
# Cost design: Inception Mercury 2.5 diffusion LLM (OpenAI-compatible).
# Fast (~1000 tok/s) and cheap ($0.20/1M in, $0.75/1M out) with 260K context.
# `effort: low` + `reasoning_effort: low` keep reviews quick and cheap.
# To change the model later, edit the repo Variable (no code change):
#   Settings -> Secrets and variables -> Actions -> Variables -> OCR_LLM_MODEL
#
# Required secrets/vars (Settings -> Secrets and variables -> Actions):
#   secret    OCR_LLM_URL            e.g. https://api.inceptionlabs.ai/v1/chat/completions
#   secret    OCR_LLM_AUTH_TOKEN     Inception API key
#   variable  OCR_LLM_MODEL          e.g. mercury-2.5
#   variable  OCR_LLM_USE_ANTHROPIC  'false' for OpenAI-compatible endpoints
#
# Source: https://github.com/alibaba/open-code-review/tree/main/examples/github_actions

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so secrets are available for fork
  # PRs. Safe: the action only reads the diff, never executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Single source of truth for the CLI version: the pre-install step and
      # the pinned action must agree, otherwise the action reinstalls a
      # different version (slow) or validation drifts.
      # 2026-09-16: 1.12.0 -> 1.12.4 (latest stable; picks up the BPE-loader
      # install fix #1228). Action pin stays at v1.12.0 — a newer CLI than the
      # action is supported by design (action requires CLI >= v1.9.6, and
      # --effort needs CLI >= v1.10.0).
      OCR_CLI_VERSION: '1.12.4'
      # ROOT CAUSE of the `Cannot find module '/usr/local/bin/ocr'` failures
      # (2026-09-16): every `ocr` invocation spawns scripts/update.js detached,
      # which runs `npm i -g @alibaba-group/open-code-review@<latest>` whenever
      # npm `latest` is newer than the installed CLI. That global reinstall
      # unlinks/relinks /usr/local/bin/ocr mid-job, deleting the binary out
      # from under the later `ocr review` (exit 1, 0s, empty result). Verified
      # locally: install 1.12.0 with 1.12.4 as latest -> update.js executes
      # `npm i -g @alibaba-group/open-code-review@1.12.4`. The launcher honors
      # OCR_NO_UPDATE (bin/ocr.js) and passes env through to all children, so
      # setting it here disables the self-upgrade in every step, including the
      # pinned action's internal `ocr` calls. Repro: Sep-14 run passed (latest
      # == installed 1.12.0, updater no-op); Sep-16 runs failed (1.12.3/1.12.4
      # released that day, updater fired).
      OCR_NO_UPDATE: '1'
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Pre-install OpenCodeReview CLI (retry)
        shell: bash
        run: |
          # Hardening (2026-09-16): the pinned action installs the CLI with a
          # single bare `npm install -g` and hides stderr, so a transient
          # registry/network flake surfaces later as a cryptic
          # `Cannot find module '/usr/local/bin/ocr'` in the Run step.
          # Pre-install here with retries + verification: warms the npm cache
          # so the action's own install is cheap, and fails fast with a clear
          # message when the CLI truly cannot be installed.
          # --no-audit/--no-fund skip the advisory endpoint that flaps during
          # npm incidents (same policy as ci.yml's Audit step).
          for attempt in 1 2 3; do
            echo "Attempt $attempt: npm install -g @alibaba-group/open-code-review@${OCR_CLI_VERSION}"
            if npm install -g --no-audit --no-fund \
                "@alibaba-group/open-code-review@${OCR_CLI_VERSION}" \
              && command -v ocr >/dev/null 2>&1 \
              && ocr version; then
              echo "OpenCodeReview CLI ready: $(command -v ocr)"
              exit 0
            fi
            echo "::warning::CLI install attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          echo "::error::Failed to install @alibaba-group/open-code-review@${OCR_CLI_VERSION} after 3 attempts (check https://status.npmjs.org)"
          exit 1

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@494bf1c8d7a19196ab166960a06fef38d69a1d16 # v1.12.0 (pinned SHA)
        with:
          ocr_version: ${{ env.OCR_CLI_VERSION }}
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Keep reviews fast and cheap on the diffusion model: low effort,
          # low reasoning, sticky summary so re-pushes update one comment.
          effort: low
          llm_reasoning_effort: 'low'
          # Override the action's default thinking-disable payload, which
          # Mercury doesn't need; send a clean body instead.
          llm_extra_body: '{}'
          sticky_summary: 'true'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
