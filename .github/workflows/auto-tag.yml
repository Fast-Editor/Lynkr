name: Auto tag release

# Tags every push to main AND publishes to npm in the same run, with no
# manual release step and no personal access tokens. Why this shape: pushes
# authenticated with GITHUB_TOKEN never fire new workflow runs (GitHub loop
# protection), so a bot-pushed tag alone would never trigger npm-publish.yml.
# Instead the publish job below calls npm-publish.yml as a reusable workflow
# inline — same run, same GITHUB_TOKEN, OIDC publishing works. The tag push
# is kept as a version marker (and for a future PAT-based flow that also
# wants tag-triggered Docker builds, which do NOT run in this flow).
# Loop-safe by construction:
#   - release commits carry "release: vX.Y.Z" and are skipped by the `if`
#     below (plus [skip ci]);
#   - tag pushes don't match `branches: [main]`, so the tag job never
#     fires on its own tags.
# If package.json was manually bumped ahead of the last tag, that version
# is tagged as-is instead of bump-patched.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write # OIDC for the inline npm publish (provenance)

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: "!contains(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump patch and tag when package.json is unreleased
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PKG_VERSION=$(node -p "require('./package.json').version")
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          LAST_VERSION="${LAST_TAG#v}"
          if [ "$PKG_VERSION" != "$LAST_VERSION" ]; then
            echo "package.json ($PKG_VERSION) differs from last tag ($LAST_TAG) — tagging as-is."
            echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"
            git tag "v$PKG_VERSION"
            git push origin "v$PKG_VERSION"
            exit 0
          fi
          echo "package.json matches last tag — bumping patch."
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "release: v$NEW_VERSION [skip ci]" || exit 0
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git tag "v$NEW_VERSION"
          git push origin main "v$NEW_VERSION"

  # Inline publish: runs npm-publish.yml's job in THIS run (same token, no
  # tag event needed), building exactly the tag the tag job just pushed.
  # Skipped when the tag job was skipped or failed.
  publish:
    needs: [tag]
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}
    secrets: inherit
